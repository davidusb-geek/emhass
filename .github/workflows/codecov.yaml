name: CodeCov

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ".python-version"

      - name: Generate Report
        run: |
          uv venv
          uv sync --reinstall --extra test
          # Keep the non-DST suite serial; collect coverage from xdist workers only for DST.
          # Install CI-only tools without changing the application's test dependencies.
          uv pip install --python .venv/bin/python "pytest-cov==7.1.0" "pytest-xdist==3.8.0"
          uv run --no-sync coverage erase
          uv run --no-sync pytest tests/ --ignore=tests/dst_1189 --cov=emhass --cov-report=
          uv run --no-sync pytest tests/dst_1189 -n 4 --cov=emhass --cov-append --cov-report=
          uv run --no-sync coverage report
          uv run --no-sync coverage xml -o coverage.xml

      - name: Upload coverage reports to Codecov
        if: github.event.pull_request.head.repo.fork == false
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true

      - name: SonarQube Scan
        if: github.event.pull_request.head.repo.fork == false
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=davidusb-geek
            -Dsonar.projectKey=davidusb-geek_emhass
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=./src
            -Dsonar.tests=./tests
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.scanner.skipJreProvisioning=true
