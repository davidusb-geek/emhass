name: Python test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.14" }
    env:
      OS: ${{ matrix.os }}
      
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install HDF5 for macOS
        if: matrix.os == 'macos-latest'
        run: brew install hdf5
          
      - name: Install EMHASS with test dependencies
        run: |
          uv sync --python "${{ matrix.python-version }}" --reinstall --upgrade --extra test
          
      - name: Test with pytest
        run: |
          uv run --python "${{ matrix.python-version }}" pytest
  scan-pr:
    needs:
      - build
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932" # v2.7.1
    with:
      fail-on-vuln: false
      scan-args: |-
        --recursive
        ./
    permissions:
      security-events: write
      contents: read
      actions: read
