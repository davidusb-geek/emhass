name: Python test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }
    env:
      OS: ${{ matrix.os }}
      
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Special dependencies for macos
        if: matrix.os == 'macos-latest'
        run: |
          brew install hdf5
          uv venv
          uv pip install numpy==2.0.0 tables==3.10.2
          
      - name: Install EMHASS with test dependencies
        run: |
          uv sync --python "${{ matrix.python-version }}" --reinstall --upgrade --extra test
          
      - name: Test with pytest
        run: |
          uv run --python "${{ matrix.python-version }}" pytest
  scan-pr:
    needs:
      - build
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.0.1"
    with:
      fail-on-vuln: false
      scan-args: |-
        --recursive
        ./
    permissions:
      security-events: write
      contents: read
      actions: read
