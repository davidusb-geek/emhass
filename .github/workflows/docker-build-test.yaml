#This action test builds EMHASS Docker images, in each architecture.
name: "Test Building Docker Image"

on:
  push:
    branches: [master,testing]
  pull_request:
    branches: [master,testing]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          [
            { target_arch: amd64, buildx: "linux/amd64", os_version: debian },
            { target_arch: aarch64, buildx: "linux/arm64", os_version: debian },
          ]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform.buildx }}
          build-args: |
            TARGETARCH=${{ matrix.platform.target_arch }}
            os_version=${{ matrix.platform.os_version }}
          load: true
      - name: Test Image #Assume Docker fail with FileNotFound secrets_emhass.yaml error
        run: docker run --rm -it ${{ steps.build.outputs.imageid }} | grep -q secrets_emhass.yaml && echo 0 || echo 1
      - name: Test image starts without network access
        run: |
          docker run -d --name emhass-offline --network none ${{ steps.build.outputs.imageid }}
          # Any HTTP answer means the server is up: /healthz returns 503 until a first optimization has run.
          # Up to 90 tries 5 s apart, as the aarch64 image runs under QEMU.
          start=$SECONDS
          for _ in $(seq 1 90); do
            if status=$(docker exec emhass-offline python -c "import http.client; c = http.client.HTTPConnection('127.0.0.1', 5000, timeout=5); c.request('GET', '/healthz'); print(c.getresponse().status)" 2>/dev/null); then
              echo "EMHASS answered /healthz (HTTP $status) after $((SECONDS - start)) s with no network access"
              docker rm -f emhass-offline
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' emhass-offline)" != "true" ]; then
              echo "Container exited before serving"
              break
            fi
            sleep 5
          done
          docker logs emhass-offline
          docker rm -f emhass-offline
          exit 1
      - name: Test image starts as a non-root user
        run: |
          docker run -d --name emhass-nonroot --user 1000:0 --network none ${{ steps.build.outputs.imageid }}
          # As above, any HTTP answer from /healthz means the server is up
          start=$SECONDS
          for _ in $(seq 1 90); do
            if status=$(docker exec emhass-nonroot python -c "import http.client; c = http.client.HTTPConnection('127.0.0.1', 5000, timeout=5); c.request('GET', '/healthz'); print(c.getresponse().status)" 2>/dev/null); then
              echo "EMHASS answered /healthz (HTTP $status) after $((SECONDS - start)) s as $(docker exec emhass-nonroot id)"
              # The first start copies the default data files into /data as this user
              if docker exec emhass-nonroot ls -ln /data/opt_res_latest.csv /data/long_train_data.pkl \
                && docker exec emhass-nonroot test -O /data/opt_res_latest.csv -a -O /data/long_train_data.pkl \
                && docker exec emhass-nonroot sh -c 'touch /share/.write-test /share/emhass/.write-test && rm /share/.write-test /share/emhass/.write-test' \
                && ! docker logs emhass-nonroot 2>&1 | grep "Permission denied"; then
                docker rm -f emhass-nonroot
                exit 0
              fi
              echo "The default data files are missing from /data, /share is not writable, or the log has a permission error"
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' emhass-nonroot)" != "true" ]; then
              echo "Container exited before serving"
              break
            fi
            sleep 5
          done
          docker logs emhass-nonroot
          docker rm -f emhass-nonroot
          exit 1
      # Google OSV-Scanner
      # Extract Debian and Python packadge list stored in Image
      - name: Export Debian package list
        run: mkdir OSV && docker run --rm --entrypoint '/bin/cat' ${{ steps.build.outputs.imageid }} /var/lib/dpkg/status >> ./OSV/${{ matrix.platform.target_arch }}.status
      - name: Export Python package list
        run: docker run --rm --entrypoint '/bin/cat' ${{ steps.build.outputs.imageid }} uv.lock >> ./OSV/${{ matrix.platform.target_arch }}.lock
      - name: Upload package list as digest
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform.target_arch }}-packages
          path: ./OSV/*
          if-no-files-found: error
          retention-days: 1

  osv-scan:
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        platform:
          [
            { target_arch: amd64 },
            { target_arch: aarch64 }
          ]
    # Check Docker image debian and python packages list for known vulnerabilities
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.0"
    with:
      download-artifact: "${{ matrix.platform.target_arch }}-packages"
      matrix-property: "${{ matrix.platform.target_arch }}-"
      fail-on-vuln: false
      scan-args: |-
        --lockfile=dpkg-status:./${{ matrix.platform.target_arch }}.status
        --lockfile=uv.lock:./${{ matrix.platform.target_arch }}.lock
    permissions:
      actions: read
      security-events: write
      contents: read
