name: Update EMHASS PVLib databases

on:
  schedule: # run once a month
    - cron:  '0 0 1 * *'
  workflow_dispatch:

jobs:
  pull-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version-file: ".python-version"
    - name: install requirements
      run: python3 -m pip install --break-system-packages .[test]
    - name: pull latest SAM CEC files
      run: |
        git clone https://github.com/NatLabRockies/SAM.git /tmp/SAM
    - name: build database via python script
      run: |
        SAM_COMMIT=$(git -C /tmp/SAM rev-parse HEAD)
        python3 ./scripts/save_pvlib_module_inverter_database.py \
          --sam-dir /tmp/SAM/deploy/libraries --sam-commit "$SAM_COMMIT"
        python3 ./scripts/save_pvlib_module_inverter_database.py \
          --check --sam-dir /tmp/SAM/deploy/libraries
    - name: push database changes
      run: |
        rm -r /tmp/SAM
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add ./src/emhass/data/cec_inverters.pbz2
        git add ./src/emhass/data/cec_modules.pbz2
        git add ./scripts/cec_database_source.json
        if git diff --cached --quiet; then
          echo "No modification needed, databases already up to date"
        else
          git commit -m "chore(database): bump inverter and module database"
          git push
        fi
        
